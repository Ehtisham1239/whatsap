<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>WA Operator Console</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/console.js"></script>
</head>
<body>
  <div id="signin" class="signin">
    <form class="card" id="signin-form">
      <div class="logo"><span class="logo-mark" aria-hidden="true">W</span> Operator console</div>
      <p class="muted">Manage tenants, numbers, API keys and credits.</p>
      <label>Admin token <input id="admin-token" type="password" autocomplete="off" required></label>
      <p id="signin-error" class="error-text small" role="alert"></p>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>
  <div id="app" class="shell hidden">
    <header class="topbar">
      <div class="logo"><span class="logo-mark" aria-hidden="true">W</span><span>Operator console</span></div>
      <span class="spacer"></span>
      <button class="btn small" type="button" id="signout">Sign out</button>
    </header>
    <main><div class="page" id="page"></div></main>
  </div>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
