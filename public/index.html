<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>WA Inbox</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/inbox.js"></script>
</head>
<body>
  <div id="signin" class="signin">
    <form class="card" id="signin-form">
      <div class="logo"><span class="logo-mark" aria-hidden="true">W</span> WA Inbox</div>
      <p class="muted">Sign in with your API key to read and answer WhatsApp conversations.</p>
      <label>API key <input id="api-key" name="key" type="password" autocomplete="off" placeholder="wa_live_…" required></label>
      <p class="small muted">The key stays in this browser tab only and is cleared when you close it.</p>
      <p id="signin-error" class="error-text small" role="alert"></p>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </div>

  <div id="app" class="shell hidden">
    <header class="topbar">
      <div class="logo"><span class="logo-mark" aria-hidden="true">W</span><span>Inbox</span></div>
      <nav aria-label="Sections">
        <button type="button" data-view="inbox" aria-current="page">Inbox</button>
        <button type="button" data-view="templates">Templates</button>
        <button type="button" data-view="wallet">Wallet</button>
        <button type="button" data-view="numbers">Numbers</button>
      </nav>
      <span class="spacer"></span>
      <span class="balance" id="balance" title="Wallet balance in credits"></span>
      <button class="btn primary small" type="button" id="new-message">New message</button>
      <button class="btn small" type="button" id="signout">Sign out</button>
    </header>
    <main>
      <section id="view-inbox" class="inbox">
        <aside class="sidebar" aria-label="Conversations">
          <div class="tools">
            <input id="search" type="search" placeholder="Search name, number or text" aria-label="Search conversations">
            <div class="tabs" role="group" aria-label="Filter by status">
              <button type="button" data-status="open" aria-pressed="true">Open</button>
              <button type="button" data-status="pending" aria-pressed="false">Pending</button>
              <button type="button" data-status="resolved" aria-pressed="false">Resolved</button>
              <button type="button" data-status="" aria-pressed="false">All</button>
            </div>
          </div>
          <div></div>
          <div id="conv-list" class="conv-list"></div>
        </aside>
        <section class="thread" id="thread" aria-live="polite">
          <div class="empty" id="thread-empty">Select a conversation</div>
        </section>
      </section>
      <section id="view-templates" class="page hidden"></section>
      <section id="view-wallet" class="page hidden"></section>
      <section id="view-numbers" class="page hidden"></section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
